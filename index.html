<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anima Spellbook</title>
    <link rel="stylesheet" href="/src/styles/variables.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/layout.css" />
    <link rel="stylesheet" href="/src/styles/components.css" />
  </head>
  <body>
    <div id="app" x-data="app()" :class="{ 'sidebar-collapsed': !sidebarOpen }">
      <header class="header">
        <button
          type="button"
          class="btn btn-secondary btn-sm sidebar-toggle"
          @click="toggleSidebar()"
          :aria-expanded="sidebarOpen.toString()"
          aria-controls="filter-panel"
          x-text="sidebarOpen ? 'Hide filters' : 'Show filters'"
        ></button>
        <h1>Anima Spellbook</h1>
      </header>

      <main class="main-layout">
        <template x-if="isSpellListView">
          <aside
            id="filter-panel"
            class="filter-panel"
            x-data="filterPanel()"
            aria-label="Filters"
            x-show="sidebarOpen"
          >
          <div class="filter-panel-header">
            <button type="button" class="btn btn-secondary btn-sm" @click="clearFilters()">Clear filters</button>
          </div>
          <section class="filter-section">
            <button type="button" class="filter-section-toggle" @click="toggleSection('category')" :aria-expanded="isOpen('category').toString()">
              <span class="filter-section-title">Category &amp; Path</span>
              <span class="filter-section-chevron" aria-hidden="true" x-text="isOpen('category') ? '▾' : '▸'"></span>
            </button>
            <div class="filter-section-body" x-show="isOpen('category')" style="display:none">
              <template x-for="cat in categories" :key="cat.key">
                <div class="filter-group">
                  <label class="checkbox-item">
                    <input type="checkbox" :checked="categoryState(cat.key) === 'all'" @change="toggleCategory(cat.key, $event.target.checked)" />
                    <span x-text="cat.label"></span>
                  </label>
                  <div class="filter-subgroup">
                    <template x-for="p in cat.paths" :key="p">
                      <label class="checkbox-item">
                        <input type="checkbox" :value="p" :checked="isPathSelected(p)" @change="updatePath(p, $event.target.checked)" />
                        <span x-text="p"></span>
                      </label>
                    </template>
                  </div>
                </div>
              </template>
              <label class="checkbox-item">
                <input type="checkbox" value="free_access" :checked="isPathSelected('free_access')" @change="updatePath('free_access', $event.target.checked)" />
                <span>Free Access</span>
              </label>
            </div>
          </section>


          <section class="filter-section">
            <button type="button" class="filter-section-toggle" @click="toggleSection('level')" :aria-expanded="isOpen('level').toString()">
              <span class="filter-section-title">Level</span>
              <span class="filter-section-chevron" aria-hidden="true" x-text="isOpen('level') ? '▾' : '▸'"></span>
            </button>
            <div class="filter-section-body" x-show="isOpen('level')" style="display:none">
              <div class="filter-range">
                <label class="range-item"><span>Min</span><input type="number" min="0" step="10" :value="filters.levelMin ?? ''" @input="updateLevelMin($event.target.value === '' ? null : +$event.target.value)" /></label>
                <label class="range-item"><span>Max</span><input type="number" min="0" step="10" :value="filters.levelMax ?? ''" @input="updateLevelMax($event.target.value === '' ? null : +$event.target.value)" /></label>
              </div>
            </div>
          </section>

          <section class="filter-section">
            <button type="button" class="filter-section-toggle" @click="toggleSection('action')" :aria-expanded="isOpen('action').toString()">
              <span class="filter-section-title">Action</span>
              <span class="filter-section-chevron" aria-hidden="true" x-text="isOpen('action') ? '▾' : '▸'"></span>
            </button>
            <div class="filter-section-body" x-show="isOpen('action')" style="display:none">
              <div class="checkbox-group" role="radiogroup" aria-label="Action">
                <label class="checkbox-item"><input type="radio" name="action" :checked="filters.action === 'all'" @change="updateAction('all')" /><span>All</span></label>
                <label class="checkbox-item"><input type="radio" name="action" :checked="filters.action === 'Active'" @change="updateAction('Active')" /><span>Active</span></label>
                <label class="checkbox-item"><input type="radio" name="action" :checked="filters.action === 'Passive'" @change="updateAction('Passive')" /><span>Passive</span></label>
              </div>
            </div>
          </section>

          <section class="filter-section">
            <button type="button" class="filter-section-toggle" @click="toggleSection('types')" :aria-expanded="isOpen('types').toString()">
              <span class="filter-section-title">Types</span>
              <span class="filter-section-chevron" aria-hidden="true" x-text="isOpen('types') ? '▾' : '▸'"></span>
            </button>
            <div class="filter-section-body" x-show="isOpen('types')" style="display:none">
              <div class="checkbox-group">
                <template x-for="t in types" :key="t">
                  <label class="checkbox-item">
                    <input type="checkbox" :value="t" :checked="filters.types.includes(t)" @change="updateTypes(t, $event.target.checked)" />
                    <span x-text="t"></span>
                  </label>
                </template>
              </div>
            </div>
          </section>

          <section class="filter-section">
            <button type="button" class="filter-section-toggle" @click="toggleSection('aoe')" :aria-expanded="isOpen('aoe').toString()">
              <span class="filter-section-title">Area of Effect</span>
              <span class="filter-section-chevron" aria-hidden="true" x-text="isOpen('aoe') ? '▾' : '▸'"></span>
            </button>
            <div class="filter-section-body" x-show="isOpen('aoe')" style="display:none">
              <div class="checkbox-group" role="radiogroup" aria-label="Area of Effect">
                <label class="checkbox-item"><input type="radio" name="aoe" :checked="filters.isAoe === null" @change="updateAoe(null)" /><span>All</span></label>
                <label class="checkbox-item"><input type="radio" name="aoe" :checked="filters.isAoe === true" @change="updateAoe(true)" /><span>AoE only</span></label>
                <label class="checkbox-item"><input type="radio" name="aoe" :checked="filters.isAoe === false" @change="updateAoe(false)" /><span>Non-AoE only</span></label>
              </div>
            </div>
          </section>

          <section class="filter-section">
            <button type="button" class="filter-section-toggle" @click="toggleSection('zeon')" :aria-expanded="isOpen('zeon').toString()">
              <span class="filter-section-title">Zeon Cost</span>
              <span class="filter-section-chevron" aria-hidden="true" x-text="isOpen('zeon') ? '▾' : '▸'"></span>
            </button>
            <div class="filter-section-body" x-show="isOpen('zeon')" style="display:none">
              <div class="filter-range">
                <label class="range-item"><span>Min</span><input type="number" min="0" :value="filters.zeonMin ?? ''" @input="updateZeonMin($event.target.value === '' ? null : +$event.target.value)" /></label>
                <label class="range-item"><span>Max</span><input type="number" min="0" :value="filters.zeonMax ?? ''" @input="updateZeonMax($event.target.value === '' ? null : +$event.target.value)" /></label>
              </div>
              <div class="checkbox-group" role="radiogroup" aria-label="Zeon match mode" style="margin-top: var(--space-xs)">
                <label class="checkbox-item"><input type="radio" name="zeonMode" :checked="filters.zeonMode === 'any'" @change="updateZeonMode('any')" /><span>Any grade</span></label>
                <label class="checkbox-item"><input type="radio" name="zeonMode" :checked="filters.zeonMode === 'highest'" @change="updateZeonMode('highest')" /><span>Highest (arcane)</span></label>
              </div>
            </div>
          </section>

          <section class="filter-section">
            <button type="button" class="filter-section-toggle" @click="toggleSection('minInt')" :aria-expanded="isOpen('minInt').toString()">
              <span class="filter-section-title">Min Intelligence</span>
              <span class="filter-section-chevron" aria-hidden="true" x-text="isOpen('minInt') ? '▾' : '▸'"></span>
            </button>
            <div class="filter-section-body" x-show="isOpen('minInt')" style="display:none">
              <div class="filter-range">
                <label class="range-item"><span>Min</span><input type="number" min="0" :value="filters.minIntMin ?? ''" @input="updateMinIntMin($event.target.value === '' ? null : +$event.target.value)" /></label>
                <label class="range-item"><span>Max</span><input type="number" min="0" :value="filters.minIntMax ?? ''" @input="updateMinIntMax($event.target.value === '' ? null : +$event.target.value)" /></label>
              </div>
              <div class="checkbox-group" role="radiogroup" aria-label="Min Intelligence match mode" style="margin-top: var(--space-xs)">
                <label class="checkbox-item"><input type="radio" name="minIntMode" :checked="filters.minIntMode === 'any'" @change="updateMinIntMode('any')" /><span>Any grade</span></label>
                <label class="checkbox-item"><input type="radio" name="minIntMode" :checked="filters.minIntMode === 'highest'" @change="updateMinIntMode('highest')" /><span>Highest (arcane)</span></label>
              </div>
            </div>
          </section>

          <section class="filter-section">
            <button
              type="button"
              class="filter-section-toggle"
              @click="toggleSection('maintenance')"
              :aria-expanded="isOpen('maintenance').toString()"
            >
              <span class="filter-section-title">Maintenance</span>
              <span class="filter-section-chevron" aria-hidden="true" x-text="isOpen('maintenance') ? '▾' : '▸'"></span>
            </button>
            <div class="filter-section-body" x-show="isOpen('maintenance')" style="display:none">
              <div class="checkbox-group" role="radiogroup" aria-label="Maintenance">
                <label class="checkbox-item">
                  <input type="radio" name="maintenance" value="all" :checked="filters.maintenance === 'all'" @change="updateMaintenance('all')" />
                  <span>All</span>
                </label>
                <label class="checkbox-item">
                  <input type="radio" name="maintenance" value="no" :checked="filters.maintenance === 'no'" @change="updateMaintenance('no')" />
                  <span>No maintenance</span>
                </label>
                <label class="checkbox-item">
                  <input type="radio" name="maintenance" value="yes" :checked="filters.maintenance === 'yes'" @change="updateMaintenance('yes')" />
                  <span>Has maintenance</span>
                </label>
                <label class="checkbox-item">
                  <input type="radio" name="maintenance" value="daily" :checked="filters.maintenance === 'daily'" @change="updateMaintenance('daily')" />
                  <span>Daily only</span>
                </label>
              </div>
            </div>
          </section>
          <script>
            (function () {
              try {
                var p = new URLSearchParams(location.search);
                var active = {
                  category: !!p.get('paths'),
                  level: p.has('levelMin') || p.has('levelMax'),
                  action: p.get('action') && p.get('action') !== 'all',
                  types: !!p.get('types'),
                  aoe: p.has('aoe'),
                  zeon: p.has('zeonMin') || p.has('zeonMax') || (p.get('zeonMode') && p.get('zeonMode') !== 'any'),
                  minInt: p.has('minIntMin') || p.has('minIntMax') || (p.get('minIntMode') && p.get('minIntMode') !== 'any'),
                  maintenance: p.get('maintenance') && p.get('maintenance') !== 'all',
                };
                var root = document.currentScript && document.currentScript.parentElement;
                if (!root) return;
                var bodies = root.querySelectorAll('.filter-section-body');
                var keys = ['category','level','action','types','aoe','zeon','minInt','maintenance'];
                for (var i = 0; i < bodies.length && i < keys.length; i++) {
                  if (active[keys[i]]) bodies[i].style.display = '';
                }
              } catch (e) {}
            })();
          </script>
        </aside>
        </template>
        <template x-if="isSpellListView">
          <section class="spell-list" x-data="spellTable()">
            <div class="search-box" x-data="searchBox()">
              <label class="visually-hidden" for="spell-search">Search spells</label>
              <input
                id="spell-search"
                class="search-input"
                type="search"
                placeholder="Search by name, effect, or grade description"
                x-model="query"
                @input="search()"
                autocomplete="off"
              />
            </div>
            <div class="stats-bar" x-cloak>
              <span x-text="`${rows.length} of ${total} spells`"></span>
            </div>
            <div class="table-wrapper">
              <div class="table-container">
                <table>
                  <thead>
                    <tr>
                      <template x-for="col in columns" :key="col">
                        <th scope="col" x-text="columnLabel(col)"></th>
                      </template>
                    </tr>
                  </thead>
                  <template x-for="spell in rows" :key="spell.id">
                    <tbody class="spell-group">
                      <tr class="spell-row" @click="toggleExpanded(spell)" :class="{ expanded: isExpanded(spell) }">
                        <template x-for="col in columns" :key="`${spell.id}-${col}`">
                          <td x-text="formatValue(getField(spell, col))"></td>
                        </template>
                      </tr>
                      <tr class="spell-detail-row" x-show="isExpanded(spell)">
                        <td :colspan="columns.length">
                          <div class="spell-detail">
                            <dl class="spell-detail-meta">
                              <div><dt>Action</dt><dd x-text="spell.action"></dd></div>
                              <div><dt>Types</dt><dd x-text="spell.types.join(', ') || '—'"></dd></div>
                              <template x-if="spell.daily_maintenance"><div><dt>Daily maintenance</dt><dd></dd></div></template>
                            </dl>
                            <template x-for="g in [{k:'initial',l:'Initial'},{k:'intermediate',l:'Intermediate'},{k:'advanced',l:'Advanced'},{k:'arcane',l:'Arcane'}]" :key="g.k">
                              <div class="spell-grade">
                                <h4 class="spell-grade-title" x-text="g.l"></h4>
                                <div class="spell-grade-stats">
                                  <span><strong>Zeon:</strong> <span x-text="spell.grades[g.k].zeon"></span></span>
                                  <span><strong>Min Int:</strong> <span x-text="spell.grades[g.k].min_int"></span></span>
                                  <span><strong>Maintenance:</strong> <span x-text="spell.grades[g.k].maintenance ?? '—'"></span></span>
                                </div>
                                <p class="spell-grade-desc" x-text="spell.grades[g.k].description"></p>
                              </div>
                            </template>
                          </div>
                        </td>
                      </tr>
                    </tbody>
                  </template>
                </table>
              </div>
            </div>
            <template x-if="rows.length === 0">
              <div class="empty-state">No spells loaded.</div>
            </template>
          </section>
        </template>
        <section class="spellbooks-view" x-show="isSpellbooksView" aria-label="Spellbooks">
          <h2>Spellbooks</h2>
          <p>Spellbook management is not yet available in this view.</p>
          <button type="button" class="btn btn-secondary" @click="goToSpellList()">Back to spell list</button>
        </section>
      </main>

    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
